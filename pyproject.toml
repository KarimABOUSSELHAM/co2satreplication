[project]
name = "co2-satellite-replication"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cartopy>=0.25.0",
    "duckdb==1.4.1",
    "geopandas>=1.1.3",
    "h5netcdf>=1.8.1",
    "h5py>=3.16.0",
    "httpx>=0.28.1",
    "ipykernel>=7.2.0",
    "jupyter>=1.1.1",
    "loguru>=0.7.3",
    "matplotlib>=3.10.9",
    "netcdf4>=1.7.4",
    "pandas>=3.0.3",
    "pandas-stubs>=3.0.5.260730",
    "plotly>=6.7.0",
    "pyarrow>=24.0.0",
    "pydantic>=2.13.4",
    "pyproj>=3.7.2",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "s3fs>=2026.4.0",
    "seaborn>=0.13.2",
    "shapely>=2.1.2",
    "tqdm>=4.67.3",
    "tqdm-stubs>=0.2.1",
    "xarray>=2026.4.0",
    "zarr>=3.2.1",
]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.13",
    "types-requests>=2.33.0.20260513",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/co2sat"]
